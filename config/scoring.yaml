    - preview
    - calendar
    - recap
    - 一周
    - 本月盘点

# ===== LLM 配置 =====
# 环境变量：LLM_API_KEY（统一）或 MINIMAX_API_KEY / DEEPSEEK_API_KEY
#
# ⚠️ MiniMax 的 max_tokens 含思考 token，设太小会返回空 content。
# ⚠️ 国内 key 只能走 api.minimaxi.com；国际站 api.minimax.io 会 401。

llm:
  provider: minimax_domestic
  model: MiniMax-M2.7
  base_url: https://api.minimaxi.com/v1
  temperature: 0.3
  max_tokens: 16000
  json_mode: false     # MiniMax 不支持 response_format，靠 prompt + 鲁棒解析
  batch_size: 30
  max_retries: 2

providers:
  deepseek:
    base_url: https://api.deepseek.com/v1
    model: deepseek-chat
    max_tokens: 8000
    json_mode: true
    env_key: DEEPSEEK_API_KEY
  minimax:
    base_url: https://api.minimax.io/v1
    model: MiniMax-M3.1-Flash-Preview
    max_tokens: 16000
    json_mode: false
    env_key: MINIMAX_API_KEY
  minimax_domestic:
    base_url: https://api.minimaxi.com/v1
    model: MiniMax-M2.7
    max_tokens: 16000
    json_mode: false
    env_key: MINIMAX_API_KEY
  minimax_flash:
    base_url: https://api.minimaxi.com/v1
    model: MiniMax-M3.1-Flash-Preview
    max_tokens: 16000
    json_mode: false
    env_key: MINIMAX_API_KEY

# 成稿配置
#
# ⚠️ 实测（BD 雷达，同一篇文章 A/B）：内容/模板分离后，
#   推理模型 M2.7 全面优于 Flash：46s/3291字符 对 113s/0字符（空响应）。
#   此前 M2.7 显得差，是因为它同时扛 HTML+CSS 的格式负担。
gen_llm:
  provider: minimax_domestic
  model: MiniMax-M2.7
  base_url: https://api.minimaxi.com/v1
  max_tokens: 32000
  temperature: 0.7
  json_mode: false
