  pure_bd:
    - 达成合作
    - 签署协议
    - 授权引进
    - 对外授权
    - 收购
    - 并购
    - license
    - acquisition
    - merger
    - buyout
  personnel:
    - 履新
    - 任命
    - 加盟
    - 离职
    - 出任
    - appointed
    - hires
  pure_financing:
    - IPO
    - raises
    - financing round
    - Series A
    - Series B
    - 定增
    - 融资轮
    - 上市募资
