# 临床数据雷达 · 评分配置
#
# 评分维度与 BD 雷达完全不同：
#   BD 雷达看"这笔交易值多少钱"
#   本雷达看"这个临床数据有多重要"——终点结果、阶段、未满足需求、可信度

score:
  dimensions:
    # 权重最高。临床雷达的核心就是"终点到底达没达到"
    endpoint_result:
      label: 终点结果
      max: 3.0
      desc: |
        主要终点达到且统计学显著 = 3.0
        主要终点未达到（明确失败）= 2.8   ← 失败同样是行业级事件，不降权
        因安全性终止 = 3.0
        达到但未达预设阈值 / 部分达到 = 1.5
        疗效数据积极但未明确终点结论 = 1.2
        仅有进展（入组完成/启动）= 0.5
        无法判定 = 0.6
      note: |
        ⚠️ 必须区分"疗效数据"与"达到终点"。
        "38 例全部应答，80% 完全缓解" 是疗效数据，
        不等于达到了试验预设的主要终点——后者取决于统计假设。
        数据来自注册库统计检验（analyses/p值）的，可信度高于只转载新闻措辞的。

    stage_scale:
      label: 阶段与规模
      max: 2.0
      desc: |
        III期/注册试验 = 2.0（样本量 >500 再加 0.3，上限 2.0）
        II期 = 1.2
        I期 = 0.5
        研究者发起/回顾性 = 0.3
        前瞻性队列/真实世界 = 0.4
      note: 样本量过小（<100）应下调，单臂无对照下调

    unmet_need:
      label: 未满足需求
      max: 1.5
      desc: |
        无有效疗法（如胰腺癌、胶质瘤）= 1.5
        现有疗法有限/预后差 = 1.0
        已有多种疗法但仍有空间 = 0.6
        竞争激烈（如 PD-1、GLP-1）= 0.3

    first_in_class:
      label: 首创性
      max: 1.5
      desc: |
        全球首个同机制/靶点 = 1.5
        全球首个同适应症 = 1.2
        国产首个 = 1.0
        国内前 3 家 = 0.6
        me-too / 仿制 = 0.2

    data_maturity:
      label: 数据成熟度与可信度
      max: 2.0
      desc: |
        顶刊正式发表（NEJM/Lancet/Nature Medicine/JAMA）= 2.0
        学术会议口头报告（ASCO/ESMO/ASH 全会）= 1.5
        会议摘要/壁报 = 1.2
        公司顶线公告 = 1.0
        注册库有统计检验（p值/CI）= 1.3
        注册库仅裸数值 = 0.6
        仅有媒体转述 = 0.5
      note: |
        这一维是可信度闸门。同一件事，来源不同分值差一倍——
        这是为了防止"把媒体转述当成确证结论"。

  # ===== 阈值 =====
  #
  # ⚠️ 尚未在真实数据上标定。
  # BD 雷达的教训：那组 8.5/7.5 是在"41 笔旧交易被当成新交易"的
  # 污染数据上定出来的，清掉污染后真实分布顶格只有 7.5，
  # 导致多数日子产出 0-1 篇。
  #
  # 所以这里先给保守初值，**跑够 3 天真实数据后再回头校准**，
  # 校准时看的是分数分布，不是感觉。
  must_publish: 7.5
  keep: 6.0
  min_confidence: 0.5
  daily_max: 3
  daily_min: 2
  # 同药/同靶点最多展开几条，超过则合并成一篇 landscape 综述
  same_target_cluster_max: 3

