# 临床数据雷达 · 文章生成配置
#
# 从 BD 雷达的 style_guide 改造而来。
# 保留的部分：字数、AI 味词表、generation 参数（都经过实测校准）
# 换掉的部分：文章类型（临床四种）、内容硬规则（终点结论的来源层级）

# 铁律（违反即判定失败，触发重试）
hard_rules:
  content_rules: |
    【内容规范】
    - 正文 2800-3200 字（不含表格和脚注）
    - HOOK 第一句必须交代时间（年-月-日）
    - 开头必须有钩子：一个反常识数字，或一组矛盾对比
    - 每篇末尾必须有 FN 脚注列出来源，并注明类型
      （注册库 / 期刊 / 学术会议 / 公司公告 / 媒体转述）
    - 查不到的数据写"未找到公开数据"，禁止编造
    - **终点结论必须标来源层级**：
        注册库统计分析 → 可说"达到主要终点"
        新闻/公告措辞   → 必须写"据公告，称达到主要终点"
        仅数值推断      → 只能写"注册库显示 X 组为 Y，未提供统计检验"
    - **疗效数据 ≠ 达到终点**：只说疗效数字时，不得写成"试验成功"

  style_rules: |
    【文风 — 大白话，不要 AI 味】
    - 用大白话，短句，不用长定语
    - 禁止：赋能、底层逻辑、抓手、护城河、值得注意的是、需要注意的是、
            综上所述、总而言之、不言而喻、至关重要、里程碑意义
    - 禁止"不是…而是…"排比句式
    - 禁止"本文将""本系列将""让我们"
    - 开头直接抛数字或场景，不要铺垫

# 禁止词（质检用）
banned_words:
  - 赋能
  - 底层逻辑
  - 抓手
  - 值得注意的是
  - 需要注意的是
  - 综上所述
  - 总而言之
  - 不言而喻
  - 至关重要
  - 具有里程碑意义
  - 本文将
  - 本系列将
  - 让我们

banned_patterns:
  - '不是[^，。]{0,15}而是'
  - '不只是[^，。]{0,10}更是'
  - '既[^，。]{0,12}又[^，。]{0,12}还'

# 四种文章类型的结构要求
article_types:
  readout:
    name: 单试验结果读出
    structure: |
      1. 钩子：这个结果最反常识的数字，并写明时间
      2. 终点结果：主要终点是什么，达到了没有，依据是什么层级（表格化）
      3. 数据拆解：各分组数值、样本量、统计学意义
      4. 横向对照：与同类药物/既有标准疗法比，好在哪、差在哪
      5. 未满足需求：这个适应症现在的治疗现状
      6. 判断：这个数据改变了什么，下一步看什么

  halt:
    name: 终止/失败复盘
    structure: |
      1. 钩子：终止这件事本身的分量，并写明时间
      2. 事实：哪个试验、什么阶段、多少样本、为什么停（表格化）
      3. 时间线：从启动到终止经历了什么
      4. 影响：对这个公司、这个靶点、这个赛道意味着什么
      5. 同类项目：还有谁在做同样的方向，他们怎么样了
      6. 判断：这是单个项目的问题还是整个方向的信号

  landscape:
    name: 赛道对比
    structure: |
      1. 钩子：这个赛道最近变了什么
      2. 全景表：主要玩家/资产/阶段/数据一览
      3. 格局分析：谁领先，为什么领先
      4. 关键数据：阶段分布、样本量、终点选择的差异
      5. 时间表：未来 12-18 个月看什么
      6. 判断：这是短期热度还是长期趋势

  milestone:
    name: 进展节点
    structure: |
      1. 钩子：这个节点的意义，并写明时间
      2. 事实：什么试验、什么阶段、进展到哪一步（表格化）
      3. 前情：这个项目之前走到哪了
      4. 为什么重要：这个节点的成败意味着什么
      5. 下一步：接下来看什么，时间表
      6. 判断：给读者的结论

# 生成参数
generation:
  temperature: 0.7
  max_retries: 3
  target_words: 3000
  # ⚠️ 容差：2250 的下限太紧——实测有一篇写到 2243 字（只差 7 字）
  # 被打回，重试后掉到 1588 字彻底失败。重试的代价远大于那 7 个字。
  # 0.70 → 下限 2100，够容纳"接近目标"的稿子，同时挡掉明显过短的。
  # 上限 3900（130%）保持不动。
  word_tolerance: 0.70
  # ⚠️ 近下限宽限（2026-10-21）：硬下限 2100 仍然会误杀"只差几个字"的稿子。
  # 实测 2026-10-21 有一篇 2099 字（差 1 字）被字数判死，
  # 重试后掉到 1588 字彻底失败——一篇结构完整、事实全部可溯源的稿子
  # 因为 1 个字被扔掉，而重试的代价是整篇重写。
  # 宽限 100 字 = 实际下限 2000，足够容纳"接近目标"的稿子，
  # 同时仍然挡掉明显过短的（<2000 一律判死）。
  # ⚠️ 下限口径唯一：src/compose.py 的 word_bounds()/word_floor()，
  #    校验和"放弃成稿"两处必须共用（见该文件里的说明）。
  word_floor_slack: 100
  max_words: 3900
  # AI 味词容忍度：出现 1-2 次不触发重试
  #（实测单词触发整篇重写，代价远大于收益，且重写常引入新的字数问题）
  ai_word_tolerate: 2
  ai_word_hard_limit: 5
