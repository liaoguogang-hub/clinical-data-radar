  # ============================================================
  # 中文 · 生物谷专科频道（实测正文可抓，div.content）
  #
  # 实测：频道页 14-19 篇文章链接，正文 1600-6300 字符。
  # 链接模式 http://news.bioon.com/article/<hex>.html
  # 内容质量高，标题直接带临床数据，例如：
  #   "NEJM：CAR-T新星 anito-cel 治疗复发/难治多发性骨髓瘤
  #    ——38 例全部应答，近 80% 完全缓解，3 年生存 65%"
  #
  # ⚠️ 实测：连续请求 bioon.com 的 6 个频道（无间隔）会触发腾讯 WAF，
  # 之后【全站所有路径】都返回同一个 1681 字节验证码页，HTTP 仍是 200。
  # 规避手段：只保留 3 个临床相关性最高的频道 + 同域请求间隔 2 秒。
  # 想加回更多频道，先确认 WAF 容忍度，别一次开满。
  - id: bioon_trials
    name: 生物谷 - 临床研究
    lang: cn
    url: https://www.bioon.com/trials
    mode: html
    access: full
    weight: 1.3
    tier: cn_channel
    note: 实测 16-19 篇，正文可抓（div.content）

  - id: bioon_tumor_immunotherapy
    name: 生物谷 - 肿瘤免疫治疗
    lang: cn
