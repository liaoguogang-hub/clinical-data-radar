# ============================================================
# 一手材料源（不做发现，只在"搜一手材料"环节调用）
# ============================================================
primary_sources:
  clinicaltrials_gov:
    name: ClinicalTrials.gov v2 API
    base: https://clinicaltrials.gov/api/v2/studies
    enabled: true
    note: |
      实测可用。按药名/申办方/NCT号查，拿结构化结果：
      - resultsSection.outcomeMeasures[]  终点定义与数值
      - analyses[]                         p值/CI（仅部分试验有，实测 1/3）
      - whyStopped                         终止原因原文
      实测：近 10 天 781 项 III 期有更新；近一月 348 项终止。
      注册库不给"是否达到终点"的结论，只给数值。判定逻辑见 verdict.py

  pubmed:
    name: PubMed E-utilities
    base: https://eutils.ncbi.nlm.nih.gov/entrez/eutils
    enabled: true
    note: 实测可用，2026 年临床试验 25,250 篇

  medrxiv:
    name: medRxiv API
    base: https://api.biorxiv.org/details/medrxiv
    enabled: true
    note: 实测可用，10 天区间 481 篇预印本

  sec_edgar:
    name: SEC EDGAR（公司顶线结果公告）
    base: https://www.sec.gov
    enabled: true
    note: 复用 BD 雷达的 edgar.py

  conferences:
    name: 学术会议（ASCO/ESMO/ASH/ADA/AACR…）
    enabled: false
    note: 摘要库与会议日历待接入

  openfda:
    name: openFDA
    base: https://api.fda.gov
    enabled: false
    note: 实测查询返回 HTTP 500，日期语法需调整，暂缓
