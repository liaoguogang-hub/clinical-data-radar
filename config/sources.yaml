      正文在 div.left（不是 div.content——后者只有 365 字符，是诱饵）。
      日期在 JSON-LD 的 datePublished。
      标题形态极对口，例如：
        "脑癌疫苗Ⅱ期未达终点，公司仍有信心"
        "众生药业GLP-1R/GIPR激动剂III期研究成功"
