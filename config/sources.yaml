# 临床数据雷达 · 源清单
#
# 定位：搜临床专业网站/自媒体拿话题 → 打分 → 搜一手材料 → 成文
# 注册库（ClinicalTrials.gov 等）不做发现源，只在"搜一手材料"环节使用。
#
# access 分级：
#   full     正文可读，可直接用于写作
#   headline 只有标题/摘要
#   rss      走 RSS
#   blocked  确认封爬
#   disabled 无有效产出
#
# 所有条目均为 2026-10-11 实测结论，不要凭印象增删。

version: 1

fetch:
  # 正文抓取配额（按源）。正文是这个雷达最有价值的部分
  # （标题只有一句话，正文才有终点结果、数值、安全性数据），
  # 所以配额给得比较宽。
  article_quota:
    bioon_trials: 12
    bioon_tumor_immunotherapy: 8
    bioon_celltherapy: 8
    bioon_genetherapy: 6
    bioon_antibodies: 8
    bioon_neuroscience: 6
    pharnexcloud: 30
    pharmcube: 8
  timeout: 25
  # 陈旧过滤阈值（天）。发布日期未知的条目不受限。
  max_age_days: 21

sources:
  # ============================================================
