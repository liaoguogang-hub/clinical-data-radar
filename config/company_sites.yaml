# 公司官网地址表（供公司背景补全用）
#
# 用途：成稿素材不足时，`companyinfo.py` 会来这里取官网 URL，
#       抓一段公司自述放进素材，供"介绍公司背景"扩写使用。
#
# ⚠️ 这一项**必须人工维护**，不要靠程序猜域名。
#    猜错的后果是抓到**别人家**的站点，然后把别人的产品/营收
#    当成本公司的写进稿子——比没有材料严重得多。
#
# 安全网：抓回来的页面会先验证正文里**是否出现该公司名**
#        （中文名或英文名任一），不出现就整段丢弃并在素材里注明。
#        所以配错的 URL 不会静默产出错误事实，只会浪费一次请求。
#
# 格式：
#   sites:
#     中文名: https://...
#     英文名: https://...
#
# 建议指向：公司官网的「关于我们」/「公司简介」/「产品管线」页。
# 收录原则：只放你确认过的官方域名；子公司/仿冒站不要放。

sites:
  # 下面几条为示例，请自行核对后再启用。
  # 百济神州: https://www.beigene.cn/about-us
  # 恒瑞医药: https://www.hengrui.com/about/
  # 诺诚健华: https://www.innocarepharma.com/
