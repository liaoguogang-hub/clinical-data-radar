name: Clinical Data Radar

on:
  schedule:
    # 北京时间 05:17 = UTC 21:17（前一天）
    #
    # ⚠️ 为什么不是整点 05:00？
    # GitHub 官方文档明确说：schedule 事件在整点（start of every hour）
    # 高负载时会被延后，"如果负载足够高，一些排队的任务可能被丢弃"。
    # 实测（2026-10-12）：两个仓库用整点 cron（0 21 / 0 22），
    # 连续 4 个触发窗口【一个都没跑】——不是延迟，是彻底没触发。
    # Node.js 官方仓库也专门把 cron 偏移 3 分钟来规避这个问题。
    # 所以这里偏移 17 分钟，避开整点高峰。
    #
    # ⚠️ 另一层保险：本机有一个 Windows 计划任务会在这个时间之后再触发一次
    # （见 README「定时任务的第二条腿」）。重复触发由下面的 guard job 拦掉。
    - cron: '17 21 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: '补抓指定日期 (YYYY-MM-DD)，留空为今天'
        required: false
        default: ''
      skip_compose:
        description: '只跑采集+评分+一手材料，不生成文章'
        type: boolean
        default: false
      skip_llm:
        description: '冒烟测试：跳过所有 LLM 步骤（不需要 API key）'
        type: boolean
        default: false

concurrency:
  group: radar-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # ============================================================
  # 先检查"今天是否已经跑过"
  #
  # 存在的理由：定时任务有【两条腿】——GitHub 的 cron 和本机的计划任务。
  # 两条腿都可能触发，不做检查就会重复采集、重复成稿、重复推送飞书。
  #
  # 判据用 data/scored/<date>.json：它由评分步骤产出、由"提交产出"提交，
  # 是"今天确实跑完过"的可靠信号（data/raw/ 被 gitignore 了，不能用）。
  #
  # ⚠️ 只对 schedule 触发做这个判断。手动触发（冒烟测试、补跑）一律执行，
  #    否则 skip_llm 冒烟测试会因为"今天跑过了"而被拦掉。
  # ============================================================
  guard:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 检查今天是否已跑过
        id: check
        run: |
          DATE="${{ inputs.date }}"
          if [ -z "$DATE" ]; then
            DATE=$(TZ=Asia/Shanghai date +%F)
          fi
          echo "北京日期：$DATE"
          if [ "${{ github.event_name }}" = "schedule" ] && [ -f "data/scored/$DATE.json" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "⏭  今天已经跑过（data/scored/$DATE.json 存在），本次跳过。"
            echo "   触发来源：${{ github.event_name }}"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "▶  今天还没跑过，继续执行。"
          fi

  radar:
    needs: guard
    if: needs.guard.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 采集（含临床噪声过滤与正文抓取）
        working-directory: src
        run: python fetch.py ${{ inputs.date }}

      - name: 去重
        working-directory: src
        run: python dedupe.py ${{ inputs.date }}

      - name: LLM 评分（临床五维 + 双栏目）
        if: ${{ inputs.skip_llm != true }}
        working-directory: src
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: python score.py ${{ inputs.date }}

      - name: 选题（中国 / 全球 分别选）
        if: ${{ inputs.skip_llm != true }}
        working-directory: src
        run: python pick.py ${{ inputs.date }}

      - name: 一手材料补全（ClinicalTrials.gov + 终点判定）
        if: ${{ inputs.skip_llm != true }}
        working-directory: src
        run: python enrich.py ${{ inputs.date }}

      - name: 生成文章
        if: ${{ inputs.skip_llm != true && inputs.skip_compose != true }}
        working-directory: src
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: python compose.py ${{ inputs.date }}

      - name: 发布站点
        if: ${{ inputs.skip_compose != true }}
        working-directory: src
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          SITE_BASE_URL: ${{ vars.SITE_BASE_URL }}
        run: python publish.py ${{ inputs.date }}

      - name: 提交产出
        run: |
          git config user.name  "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add data posts site
          if git diff --staged --quiet; then
            echo "无变更"
          else
            git commit -m "chore(radar): $(date -u +%Y-%m-%d) 采集/评分/成稿"
            git push
          fi

      - name: 上传 Pages 产物
        if: ${{ inputs.skip_compose != true }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: 部署 Pages
        if: ${{ inputs.skip_compose != true }}
        id: deployment
        uses: actions/deploy-pages@v4

      - name: 失败时保留调试产物
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-${{ github.run_id }}
          path: |
            data/debug/
            data/compose_*.json
          retention-days: 14
          if-no-files-found: ignore
