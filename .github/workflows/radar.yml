name: Clinical Data Radar

on:
  schedule:
    # 北京时间 05:00 = UTC 21:00（前一天）
    #
    # 每天只跑一次。选 05:00 而不是更晚，是为了让稿子在读者起床前就位。
    # 此时能覆盖：欧美前一交易日的盘后公告、以及亚洲前一日的会议读出。
    #
    # ⚠️ cron 用 UTC，且 GitHub 的定时任务在仓库连续 60 天无提交后会被停用。
    # 本仓库每天有 chore(radar) 提交，所以不会触发那条规则。
    - cron: '0 21 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: '补抓指定日期 (YYYY-MM-DD)，留空为今天'
        required: false
        default: ''
      skip_compose:
        description: '只跑采集+评分+一手材料，不生成文章'
        type: boolean
        default: false
      skip_llm:
        description: '冒烟测试：跳过所有 LLM 步骤（不需要 API key）'
        type: boolean
        default: false

concurrency:
  group: radar-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 采集（含临床噪声过滤与正文抓取）
        working-directory: src
        run: python fetch.py ${{ inputs.date }}

      - name: 去重
        working-directory: src
        run: python dedupe.py ${{ inputs.date }}

      - name: LLM 评分（临床五维 + 双栏目）
        if: ${{ inputs.skip_llm != true }}
        working-directory: src
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: python score.py ${{ inputs.date }}

      - name: 选题（中国 / 全球 分别选）
        if: ${{ inputs.skip_llm != true }}
        working-directory: src
        run: python pick.py ${{ inputs.date }}

      - name: 一手材料补全（ClinicalTrials.gov + 终点判定）
        if: ${{ inputs.skip_llm != true }}
        working-directory: src
        run: python enrich.py ${{ inputs.date }}

      - name: 生成文章
        if: ${{ inputs.skip_llm != true && inputs.skip_compose != true }}
        working-directory: src
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: python compose.py ${{ inputs.date }}

      - name: 发布站点
        if: ${{ inputs.skip_compose != true }}
        working-directory: src
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          SITE_BASE_URL: ${{ vars.SITE_BASE_URL }}
        run: python publish.py ${{ inputs.date }}

      - name: 提交产出
        run: |
          git config user.name  "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add data posts site
          if git diff --staged --quiet; then
            echo "无变更"
          else
            git commit -m "chore(radar): $(date -u +%Y-%m-%d) 采集/评分/成稿"
            git push
          fi

      - name: 上传 Pages 产物
        if: ${{ inputs.skip_compose != true }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: 部署 Pages
        if: ${{ inputs.skip_compose != true }}
        id: deployment
        uses: actions/deploy-pages@v4

      - name: 失败时保留调试产物
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-${{ github.run_id }}
          path: |
            data/debug/
            data/compose_*.json
          retention-days: 14
          if-no-files-found: ignore
